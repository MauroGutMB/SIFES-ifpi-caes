services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sifes
      POSTGRES_PASSWORD: sifes
      POSTGRES_DB: sifes
    ports:
      - "5432:5432"
    volumes:
      - sifes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sifes -d sifes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sifes_postgres_data:
