name: Deploy

on:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (test + deploy no Render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npx eslint "src/**/*.ts" "test/**/*.ts"

      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Testes unitários
        working-directory: backend
        run: npx jest --silent

      - name: Disparar deploy no Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Esperar o deploy ficar "live"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          for i in $(seq 1 60); do
            RESPOSTA=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1")
            STATUS=$(echo "$RESPOSTA" | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['deploy']['status'])")
            echo "Status do deploy: $STATUS"
            if [ "$STATUS" = "live" ]; then
              exit 0
            fi
            if [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "update_failed" ] || [ "$STATUS" = "deactivated" ] || [ "$STATUS" = "canceled" ]; then
              echo "Deploy do backend falhou com status: $STATUS"
              exit 1
            fi
            sleep 15
          done
          echo "Timeout esperando o deploy do backend ficar live"
          exit 1

  frontend:
    name: Frontend (codegen + build + deploy no Cloudflare)
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Gerar client da API (contra o backend já publicado)
        working-directory: frontend
        env:
          API_DOCS_URL: ${{ secrets.RENDER_API_URL }}/docs-json
        run: npm run codegen

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.RENDER_API_URL }}
        run: npm run build

      - name: Deploy no Cloudflare
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
