name: Deploy

on:
  push:
    branches: [main]

# Menor privilégio por padrão; o job de deploy pede só o que precisa.
permissions:
  contents: read

# Nunca dois deploys ao mesmo tempo.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  backend:
    name: Backend (lint + testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sifes
          POSTGRES_PASSWORD: sifes
          POSTGRES_DB: sifes
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sifes:sifes@localhost:5432/sifes?schema=public
      JWT_ACCESS_SECRET: ci-e2e-access-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret
      JWT_REFRESH_EXPIRES_IN: 7d
      COOKIE_SECURE: "false"
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npx eslint "src/**/*.ts" "test/**/*.ts"

      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Testes unitários
        working-directory: backend
        run: npx jest --silent

      - name: Aplicar migrations no Postgres de CI
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Testes e2e
        working-directory: backend
        run: npm run test:e2e

  deploy:
    name: Backend (build da imagem + deploy na VPS)
    needs: backend
    runs-on: ubuntu-latest
    # Os secrets abaixo ficam no Environment "production" (Settings > Environments), que pode
    # exigir aprovação manual — e nunca são expostos a PRs vindos de forks.
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Nome das imagens (GHCR exige minúsculas)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push do backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/sifes-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/sifes-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Configurar SSH (host key fixada, sem confiar no primeiro uso)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' \
            "$VPS_HOST" "$VPS_USER" > ~/.ssh/config

      - name: Atualizar a stack na VPS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Token efêmero do job (expira ao fim do run) — nenhum PAT guardado na VPS.
          printf '%s' "$GH_TOKEN" | ssh vps "docker login ghcr.io -u '$GH_ACTOR' --password-stdin"
          ssh vps "cd /opt/sifes && export IMAGE_TAG=$IMAGE_TAG && \
            docker compose -f docker-compose.prod.yml pull backend && \
            docker compose -f docker-compose.prod.yml up -d --remove-orphans && \
            docker logout ghcr.io && docker image prune -f"

      - name: Verificar saúde da API
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          # GET / exige login (guard global): 401 também prova que Caddy + API estão respondendo.
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/" || true)
            if [ "$CODE" = "200" ] || [ "$CODE" = "401" ]; then echo "no ar ($CODE)"; exit 0; fi
            sleep 6
          done
          echo "API não respondeu após o deploy"; exit 1

  frontend:
    name: Frontend (build + deploy no Cloudflare)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      # O client da API (orval) já está commitado em src/api/generated — não precisa do Swagger
      # no ar (o /docs não é exposto em produção).
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.API_URL }}
        run: npm run build

      - name: Deploy no Cloudflare
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
