# Espelha o proxy de desenvolvimento do Vite (vite.config.ts, API_ROUTE_PREFIXES) — cada prefixo
# de rota de topo do backend precisa aparecer aqui também. Sem path rewrite, pelo mesmo motivo do
# dev: o cookie httpOnly do refresh token (Path=/auth) precisa bater com a origem que o navegador vê.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 é o DNS embutido do Docker nas redes de usuário (criadas pelo compose).
    # Resolver "backend" numa variável (em vez de host fixo no proxy_pass) adia a resolução pra
    # tempo de requisição — sem isso, o Nginx falha ao SUBIR inteiro se o container `backend`
    # ainda não existir no DNS no instante exato em que ele inicializa.
    resolver 127.0.0.11 valid=30s;

    location ~ ^/(auth|users|alunos|professores|turmas|semestres|materias|atividades|aulas|itens-avaliacao|materiais-aula|admin|relatorios|arquivos)(/|$) {
        set $upstream_backend http://backend:3000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # SPA — qualquer rota que não seja da API cai no index.html (roteamento client-side).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome (gerados pelo build do Vite) podem ser cacheados por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
